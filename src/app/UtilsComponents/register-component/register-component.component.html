<form action="" class="form" [formGroup]="userForm" id="userForm" (ngSubmit)="sendData()">


    <div class="input_container">
        <div class="vibration_container" 
        appVibration #vibrationFields="appVibration"
        [shouldVibrate]="hasAnyError('email')"
        >
            <label for="email">Email<sup>*</sup>: </label>
            <input formControlName="email"
                [ngClass]="{'error_input': hasAnyError('email')}" class="input" type="text" id="email" name="email"
                placeholder="Enter your email">
        </div>
        <div class="error_message" *ngIf="hasError('email', 'required')">
            The email is required
        </div>
        <div class="error_message" *ngIf="hasError('email', 'pattern')">
            Enter a valid email
        </div>
    </div>
    <div class="input_container">
        <div class="vibration_container" appVibration #vibrationFields="appVibration"
        [shouldVibrate]="hasAnyError('password')"
        >

            <label for="password">Password<sup>*</sup>: </label>
            <div class="input password_input" [ngClass]="{'error_input': hasAnyError('password')}">
                <input class="password" formControlName="password" [type]="passwordVisibility? 'text': 'password'"
                    id="password" name="password" placeholder="Enter your password">
                <div class="visibility" (click)="changePasswordVisibility()">
                    @if (!passwordVisibility) {
                    <span class="material-symbols-outlined" translate="no">
                        visibility_off
                    </span>
                    }
                    @else {
                    <span class="material-symbols-outlined" translate="no">
                        visibility
                    </span>
                    }

                </div>
            </div>
        </div>
        <div class="error_message" *ngIf="hasError('password', 'required')">
            The password is required
        </div>
        <div class="error_message" *ngIf="hasError('password', 'pattern')">
            Enter a secure password (8-16 chars, uppercase, number, symbol)
        </div>
    </div>
    <button type="submit" class="submit_btn">
        <span class="material-symbols-outlined" translate="no">
            login
        </span>
        {{registrationText}}</button>
    @if (loading) {
    <mat-spinner diameter="50"></mat-spinner>

    }
    @if (error) {
    <div class="msg_error">{{error}}</div>
    }

    <app-google-login class="google_btn" (loginSuccess)="onGoogleLoginSuccesfull($event)"></app-google-login>
    <small>{{textForChangeRegistration}} <span class="redirectButton" (click)="changeRegister()">{{textForOtherRegistration}}</span></small>
</form>
