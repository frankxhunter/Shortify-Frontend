<div class="container_data">
    <h1>My Short Links</h1>
    <!-- <mat-form-field id="filter_container" appearance="fill" >
        <mat-label>Filter</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. ium" #input id="filter">
      </mat-form-field> -->
    <div class="filter_container">
        <label for="filter" class="filter_label" [ngClass]="{'small': inputActived}">Filter</label>
        <input autocomplete="off" (keyup)="applyFilter($event)" placeholder="Ex. ium" #input id="filter">
    </div>

    <div class="container_table">
        <table id="table" mat-table [dataSource]="dataSource" class="mat-elevation-z8 table">

            <!-- Id Column -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> Id. </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>


            <!-- Short Url Column -->
            <ng-container matColumnDef="Short_Url">
                <th mat-header-cell *matHeaderCellDef>Short_Url</th>
                <td mat-cell *matCellDef="let element">
                    <div class="container">
                        <a [routerLink]="['/links/logs/', element.id]">
                            {{baseUrl + '/' + element.shortUrl}}
                        </a>
                        <app-copy-button [text]="baseUrl+'/' + element.shortUrl" />\
                        <app-qr-button [data]="baseUrl+'/' + element.shortUrl" ></app-qr-button>
                        
                    </div>
                </td>
            </ng-container>

            <!-- Original Url Column -->
            <ng-container matColumnDef="Original_Url">
                <th mat-header-cell *matHeaderCellDef>Original_Url</th>
                <td mat-cell *matCellDef="let element">
                    <app-editable-button [data]="element.originalUrl" [id]="element.id" />
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
            </tr>
        </table>
    </div>


</div>
